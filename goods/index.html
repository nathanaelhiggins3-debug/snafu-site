<!doctype html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <meta name="theme-color" content="#0c1412">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SNAFU">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SNAFU — Goods</title>
  <meta name="description" content="SNAFU original production. In-house drops, forged and hoarded.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/goods.css">
<script src="/js/pixels.js"></script>
  <!-- seo:start -->
  <link rel="canonical" href="https://snafu.quest/goods/">
  <meta property="og:site_name" content="SNAFU">
  <meta property="og:type" content="website">
  <meta property="og:title" content="SNAFU — Goods">
  <meta property="og:description" content="SNAFU original production. In-house drops, forged and hoarded.">
  <meta property="og:url" content="https://snafu.quest/goods/">
  <meta property="og:image" content="https://snafu.quest/assets/icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <!-- seo:end -->
</head>
<body>

  <a class="back" href="/" aria-label="Back to home">&larr; BACK</a>

  <section class="arrival" aria-label="Vault threshold">
    <div class="arrival-bg" role="img" aria-label="Stone archway opening onto a hoard of gold"></div>
    <h1 class="wordmark">GOODS</h1>
    <div class="cue">
      <span>ENTER</span>
      <div class="cue-arrow">&darr;</div>
    </div>
  </section>

  <section class="chamber" aria-label="Vault interior">
    <div class="chamber-bg" aria-hidden="true"></div>
    <div class="chamber-veil" aria-hidden="true"></div>

    <header class="chamber-head">
      <p class="eyebrow">SNAFU ORIGINAL PRODUCTION</p>
      <h2 class="chamber-title">THE HOARD</h2>
      <p class="chamber-sub">In-house drops, made and not found.</p>
    </header>

    <div id="relics" class="relics" aria-live="polite"></div>

    <p id="empty" class="empty" hidden>The hoard is quiet right now. The next drop will fill it.</p>
  </section>

  <a class="pack-badge empty-pack" data-cart-badge href="/cart/">
    <span>PACK</span>
    <span class="count" data-cart-count>0</span>
  </a>

  <footer class="colophon">
    <p>SNAFU &mdash; forged, not found.</p>
    <p><a href="/shop/">One-offs live in the Shop &rarr; Shop the archive</a></p>
    <p><a href="/privacy/">Privacy</a></p>
  </footer>

  <script src="/js/goods-data.js" defer></script>
  <script src="/js/cart.js" defer></script>
  <script src="/js/goods.js" defer></script>
  <script src="/js/site.js" defer></script>
</body>
</html>
