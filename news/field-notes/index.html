<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SNAFU. — Field Notes</title>
  <meta name="description" content="Field Notes — the SNAFU discussion desk. Take a side on this week's take, or start a thread." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/forum.css" />

  <script defer src="https://analytics.snafu.quest/script.js" data-website-id="664fa64b-2817-4e3f-9304-bb448b8d09cd"></script>

  <style>
  /* ============================================================
     SNAFU — Field Notes, the discussion desk
     Keeps the desk arrival (scene + title) shared with Editorial
     and Interview, then drops into the forum. Everything below the
     fold is styled by css/forum.css so this page, the thread page,
     and /admin/ cannot drift apart.
     ============================================================ */

  :root {
    --cream:  #f2e4c4;
    --paper:  #efe0b8;
    --ink:    #0c1412;
    --gold:   #e3aa4d;
    --wheat:  #e8d29a;
    --wood:   #624225;
    --moss:   #3f4726;
    --floor:  #151f19;
    --rose:   #814951;
    --red:    #b8352b;
    --px: 3px;
    --display: 'Press Start 2P', monospace;
    --body: 'Pixelify Sans', monospace;

    --scene: url('../../assets/field-notes.png');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--body);
    color: var(--cream);
    background: var(--floor);
    -webkit-font-smoothing: none;
    font-smooth: never;
  }

  /* ---------- SCENE (fixed backdrop) ---------- */
  .scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: var(--scene) center / cover no-repeat, var(--floor);
    image-rendering: pixelated;
  }
  .scene::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(12,20,18,.4);
    pointer-events: none;
  }

  /* ---------- ARRIVAL ---------- */
  .arrive {
    position: relative;
    z-index: 2;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(20px, 3vw, 32px);
  }

  .path-back {
    justify-self: start;
    font-family: var(--display);
    font-size: clamp(9px, .9vw, 11px);
    letter-spacing: .18em;
    color: var(--cream);
    text-decoration: none;
    padding: calc(var(--px)*2) calc(var(--px)*3);
    background: rgba(12,20,18,.7);
    border: var(--px) solid var(--cream);
    box-shadow: var(--px) var(--px) 0 rgba(2,2,0,.7);
  }
  .path-back::before { content: '\25C2  '; color: var(--rose); }
  .path-back:hover { background: var(--cream); color: var(--ink); }

  .title {
    align-self: center;
    justify-self: center;
    text-align: center;
    padding: 0 20px;
  }
  .title .eyebrow {
    display: block;
    font-family: var(--display);
    font-size: clamp(10px, 1vw, 12px);
    letter-spacing: .3em;
    color: var(--gold);
    margin-bottom: calc(var(--px)*4);
    text-shadow: var(--px) var(--px) 0 var(--ink);
  }
  .title h1 {
    font-family: var(--display);
    font-size: clamp(28px, 6vw, 84px);
    line-height: 1;
    letter-spacing: .04em;
    color: var(--wheat);
    text-shadow:
      calc(var(--px)*-1) 0 0 var(--ink), var(--px) 0 0 var(--ink),
      0 calc(var(--px)*-1) 0 var(--ink), 0 var(--px) 0 var(--ink),
      calc(var(--px)*-1) calc(var(--px)*-1) 0 var(--ink),
      var(--px) calc(var(--px)*-1) 0 var(--ink),
      calc(var(--px)*-1) var(--px) 0 var(--ink),
      var(--px) var(--px) 0 var(--ink),
      calc(var(--px)*2) calc(var(--px)*2) 0 var(--red),
      calc(var(--px)*3) calc(var(--px)*3) 0 var(--ink),
      calc(var(--px)*5) calc(var(--px)*7) 0 rgba(2,2,0,.55);
    animation: drop .6s steps(4) both;
  }
  @keyframes drop {
    from { transform: translateY(calc(var(--px)*-6)); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  .cue {
    justify-self: center;
    align-self: end;
    font-family: var(--display);
    font-size: clamp(9px, 1vw, 11px);
    letter-spacing: .2em;
    color: var(--cream);
    text-shadow: var(--px) var(--px) 0 var(--ink);
    animation: blink 1.2s steps(1, end) infinite;
    padding-bottom: 12px;
  }
  .cue::after { content: '  \25BE'; color: var(--gold); }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:.2} }

  /* ---------- THE FLOOR ----------
     A scrim under the discussion so long threads stay readable
     over the fixed scene photo. Fades in from the arrival. */
  .floor-plate {
    position: relative;
    z-index: 2;
    background: linear-gradient(180deg,
      rgba(12,20,18,.45) 0%,
      rgba(12,20,18,.93) 9%,
      rgba(12,20,18,.96) 100%);
  }

  /* ---------- END ---------- */
  .end {
    position: relative;
    z-index: 2;
    max-width: 780px;
    margin: 0 auto;
    padding: 2vh 20px 6vh;
    text-align: center;
    color: var(--cream);
  }
  .end .marker {
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: .3em;
    color: var(--gold);
    margin-bottom: 14px;
    text-shadow: var(--px) var(--px) 0 var(--ink);
  }
  .end .colophon {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 22px;
    font-family: var(--display);
    font-size: 9px;
    letter-spacing: .18em;
    opacity: .85;
    text-shadow: var(--px) var(--px) 0 var(--ink);
  }
  .end em { color: var(--gold); font-style: normal; }
  .end a { color: var(--gold); text-decoration: none; }
  .end a:hover { color: var(--cream); }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .cue, .title h1 { animation: none; }
  }
  </style>
<script src="/js/pixels.js"></script>
</head>
<body>

  <div class="scene" aria-hidden="true"></div>

  <section class="arrive">
    <a class="path-back" href="/news/">Back to Dispatches</a>
    <div class="title">
      <span class="eyebrow">The Desk</span>
      <h1>Field Notes</h1>
    </div>
    <span class="cue">Take a side</span>
  </section>

  <div class="floor-plate">
    <main class="fm-wrap">

      <!-- ============================================================
           THE TAKE — hidden until /take says there is one this week
           ============================================================ -->
      <section class="fm-take fm-panel" id="take" hidden aria-labelledby="take-label">
        <p class="fm-eyebrow" id="take-label">The Take</p>
        <p class="fm-take__body" id="take-body"></p>

        <div class="fm-take__sides">
          <button class="fm-side fm-side--agree" type="button" id="side-agree" aria-pressed="false">
            <span class="fm-side__k">AGREE</span>
            <span class="fm-side__n" id="n-agree">0</span>
          </button>
          <button class="fm-side fm-side--nah" type="button" id="side-nah" aria-pressed="false">
            <span class="fm-side__k">NAH</span>
            <span class="fm-side__n" id="n-nah">0</span>
          </button>
        </div>

        <div class="fm-split" id="split" role="img" aria-label="Split of the vote">
          <span class="fm-split__a" id="split-a"></span>
          <span class="fm-split__n" id="split-n"></span>
        </div>

        <p class="fm-take__meta" id="take-meta"></p>
        <p class="fm-err" id="take-err" role="alert"></p>
      </section>

      <div class="fm-rule" id="take-rule" hidden></div>

      <!-- ============================================================
           THE FLOOR — composer + thread list
           ============================================================ -->
      <section aria-labelledby="floor-label">
        <p class="fm-eyebrow" id="floor-label">The Floor</p>

        <button class="fm-btn fm-btn--primary fm-btn--wide" type="button" id="start-thread">
          + START A THREAD
        </button>

        <form class="fm-composer fm-panel" id="composer" hidden>
          <label class="fm-field">
            <span>Title</span>
            <input class="fm-input" name="title" id="c-title" maxlength="120"
                   autocomplete="off" placeholder="Say it in one line">
          </label>
          <label class="fm-field">
            <span>What's the note?</span>
            <textarea class="fm-textarea" name="body" id="c-body" maxlength="4000"
                      placeholder="Field notes, receipts, arguments."></textarea>
          </label>
          <p class="fm-err" id="c-err" role="alert"></p>
          <div class="fm-row">
            <button class="fm-btn fm-btn--primary" type="submit" id="c-post">POST IT</button>
            <button class="fm-btn" type="button" id="c-cancel">CANCEL</button>
          </div>
        </form>

        <div id="threads">
          <p class="fm-note">Opening the floor&hellip;</p>
        </div>
      </section>

    </main>

    <footer class="end">
      <div class="marker">\ end of the trail \</div>
      <div class="colophon">
        <span>SNAFU. <em>Field Notes</em></span>
        <span>Los Angeles</span>
        <span>Weekly since 2026</span>
        <span><a href="/privacy/">Privacy</a></span>
        <span><a href="mailto:nate@snafu.quest">nate@snafu.quest</a></span>
      </div>
    </footer>
  </div>

  <!-- Load order matters: auth → account (modal) → forum, then the
       account layer picks up stars + NEW badges. The ids are the ones
       js/account-layer.js looks for, so nothing is fetched twice. -->
  <script id="snafu-auth-js" src="/js/snafu-auth.js"></script>
  <script id="snafu-account-js" src="/js/snafu-account.js"></script>
  <script src="/js/snafu-forum.js"></script>
  <script src="/js/account-layer.js"></script>

  <script>
  /* ============================================================
     Field Notes desk logic. Data + helpers come from SNAFUForum;
     this file only decides what goes on screen.
     ============================================================ */
  (function () {
    var F = window.SNAFUForum;
    if (!F) return;
    var SECTION = 'field-notes';

    /* ---------- THE TAKE ---------- */
    var takeEl   = document.getElementById('take');
    var takeRule = document.getElementById('take-rule');
    var bodyEl   = document.getElementById('take-body');
    var metaEl   = document.getElementById('take-meta');
    var errEl    = document.getElementById('take-err');
    var btnAgree = document.getElementById('side-agree');
    var btnNah   = document.getElementById('side-nah');
    var nAgree   = document.getElementById('n-agree');
    var nNah     = document.getElementById('n-nah');
    var splitEl  = document.getElementById('split');
    var splitA   = document.getElementById('split-a');
    var splitN   = document.getElementById('split-n');
    var take = null;

    F.getTake().then(function (res) {
      take = res && res.take;
      if (!take) return;              // no take this week — card stays hidden
      bodyEl.textContent = take.body;
      takeEl.hidden = false;
      takeRule.hidden = false;
      paintTake(take);
    }, function () { /* leave the card hidden if the take can't load */ });

    function paintTake(t) {
      var agree = Number(t.agree) || 0;
      var nah   = Number(t.nah) || 0;
      var total = Number(t.total) || (agree + nah);

      nAgree.textContent = agree;
      nNah.textContent = nah;
      btnAgree.setAttribute('aria-pressed', t.my_side === 'agree' ? 'true' : 'false');
      btnNah.setAttribute('aria-pressed', t.my_side === 'nah' ? 'true' : 'false');

      var pct = total ? Math.round((agree / total) * 100) : 50;
      splitA.style.width = pct + '%';
      splitN.style.width = (100 - pct) + '%';
      splitEl.classList.toggle('fm-split--empty', !total);
      splitEl.setAttribute('aria-label', total
        ? pct + '% agree, ' + (100 - pct) + '% nah'
        : 'No votes yet');

      var replies = Number(t.replies) || 0;
      var arguing = replies + ' arguing about it';
      metaEl.innerHTML = F.esc(total + ' took a side') + ' &middot; ' +
        (t.thread_id
          ? '<a href="thread.html?id=' + F.esc(t.thread_id) + '">' + F.esc(arguing) + '</a>'
          : F.esc(arguing));
    }

    function pickSide(side) {
      errEl.textContent = '';
      F.requireAuth('Sign up to take a side').then(function () {
        btnAgree.disabled = btnNah.disabled = true;
        F.setSide(side).then(function (res) {
          btnAgree.disabled = btnNah.disabled = false;
          take.agree = res.agree; take.nah = res.nah;
          take.total = res.total; take.my_side = res.my_side;
          paintTake(take);
        }, function (err) {
          btnAgree.disabled = btnNah.disabled = false;
          errEl.textContent = err.message || 'Could not record that. Try again.';
        });
      });
    }
    btnAgree.addEventListener('click', function () { pickSide('agree'); });
    btnNah.addEventListener('click', function () { pickSide('nah'); });

    /* ---------- COMPOSER ---------- */
    var startBtn = document.getElementById('start-thread');
    var composer = document.getElementById('composer');
    var cTitle   = document.getElementById('c-title');
    var cBody    = document.getElementById('c-body');
    var cErr     = document.getElementById('c-err');
    var cPost    = document.getElementById('c-post');

    startBtn.addEventListener('click', function () {
      F.requireAuth('Sign up to start a thread').then(function () {
        composer.hidden = false;
        startBtn.hidden = true;
        cTitle.focus();
      });
    });
    document.getElementById('c-cancel').addEventListener('click', function () {
      composer.hidden = true;
      startBtn.hidden = false;
      cErr.textContent = '';
      startBtn.focus();
    });

    composer.addEventListener('submit', function (e) {
      e.preventDefault();
      var title = cTitle.value.trim();
      var body = cBody.value.trim();
      cErr.textContent = '';
      if (!title) { cErr.textContent = 'Give it a title.'; cTitle.focus(); return; }
      if (!body)  { cErr.textContent = 'Say something in the body.'; cBody.focus(); return; }

      cPost.disabled = true;
      F.createThread({ title: title, body: body, section: SECTION }).then(function (res) {
        window.location.href = 'thread.html?id=' + encodeURIComponent(res.thread_id);
      }, function (err) {
        cPost.disabled = false;
        cErr.textContent = err.message || 'Could not post that. Try again.';
      });
    });

    /* ---------- THREAD LIST ---------- */
    var listEl = document.getElementById('threads');
    F.wireVotes(listEl, 'Sign up to vote');

    F.getThreads(SECTION).then(function (res) {
      var threads = (res && res.threads) || [];
      if (!threads.length) {
        listEl.innerHTML = '<p class="fm-note">Nothing on the floor yet. ' +
          'Start the first thread.</p>';
        return;
      }
      // pinned first, then most recently active — sorted here too so the
      // page is right no matter what order the API hands back
      threads.sort(function (a, b) {
        if (!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
        return new Date(b.last_activity || b.created_at) -
               new Date(a.last_activity || a.created_at);
      });
      listEl.innerHTML = '<ul class="fm-list">' + threads.map(row).join('') + '</ul>';
    }, function () {
      listEl.innerHTML = '<p class="fm-note">The floor is not answering. Reload in a bit.</p>';
    });

    function row(t) {
      var replies = Number(t.reply_count) || 0;
      var tags = '';
      if (t.pinned) tags += '<span class="fm-tag fm-tag--pinned">Pinned</span>';
      if (t.locked) tags += '<span class="fm-tag fm-tag--locked">Locked</span>';

      return '<li class="fm-thread' + (t.pinned ? ' fm-thread--pinned' : '') + '">' +
        F.voteButton('thread', t.id, t.score, t.my_vote) +
        '<div class="fm-thread__main">' +
          '<div class="fm-thread__head">' +
            F.byline(t.author_handle, t.author_avatar, t.author_role) +
            '<span class="fm-time">' + F.esc(F.relTime(t.created_at)) + '</span>' +
          '</div>' +
          '<a class="fm-thread__title" href="thread.html?id=' + F.esc(t.id) + '">' +
            F.esc(t.title) + '</a>' +
          '<div class="fm-thread__foot">' + tags +
            '<span>' + F.esc(F.plural(replies, 'reply', 'replies')) + '</span>' +
            (t.last_activity
              ? '<span>active ' + F.esc(F.relTime(t.last_activity)) + '</span>'
              : '') +
          '</div>' +
        '</div>' +
      '</li>';
    }
  })();
  </script>
</body>
</html>
