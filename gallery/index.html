  <style>
  :root {
    --cream:  #f2e4c4;
    --paper:  #efe0b8;
    --ink:    #0c1412;
    --gold:   #e3aa4d;
    --wheat:  #e8d29a;
    --wood:   #624225;
    --moss:   #3f4726;
    --floor:  #151f19;
    --rose:   #814951;
    --red:    #b8352b;

    /* gallery dialect */
    --stone-cool: #3a4550;
    --stone-warm: #6b5340;
    --torch:      #e88f3a;
    --torch-glow: #f4b860;
    --damp:       #1a1f26;

    --px: 3px;
    --display: 'Press Start 2P', monospace;
    --body: 'Pixelify Sans', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: var(--body);
    color: var(--cream);
    background: var(--damp);
    -webkit-font-smoothing: none;
    font-smooth: never;
  }

  /* ---------- SCENE STACK (three fixed backgrounds, cross-fade on scroll) ---------- */
  .scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: var(--damp);
  }
  .scene .layer {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity .4s steps(4);
  }
  .scene .layer.on { opacity: 1; }
  .scene img {
    width: 100%;
    height: 100%;
    /* cover, not contain: fill the whole screen like the Goods vault
       backdrop. On portrait phones contain letterboxed the landscape
       cave art into a floating image block. */
    object-fit: cover;
    object-position: center;
    image-rendering: pixelated;
    display: block;
  }
  .scene .layer {
    background:
      radial-gradient(ellipse 70% 90% at center, transparent 0%, transparent 55%, #0a0d10 100%),
      #000;
  }
  .scene::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(12,20,18,.30);
    pointer-events: none;
  }

  /* deeper darken as you scroll further */
  .veil {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg,
      transparent 0%,
      transparent 40%,
      rgba(12,20,18,.45) 75%,
      rgba(12,20,18,.75) 100%);
    pointer-events: none;
  }

  /* ---------- ARRIVAL ---------- */
  .arrive {
    position: relative;
    z-index: 2;
    min-height: 58svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(20px, 3vw, 32px);
  }

  .path-back {
    justify-self: start;
    font-family: var(--display);
    font-size: clamp(10px, 1vw, 12px);
    letter-spacing: .18em;
    color: var(--cream);
    text-decoration: none;
    padding: calc(var(--px)*2) calc(var(--px)*3);
    background: rgba(12,20,18,.6);
    border: var(--px) solid var(--cream);
    box-shadow: var(--px) var(--px) 0 rgba(2,2,0,.7);
  }
  .path-back::before { content: '\25C2  '; color: var(--rose); }
  .path-back:hover { background: var(--cream); color: var(--ink); }

  .title {
    align-self: center;
    justify-self: center;
    text-align: center;
    padding: 0 20px;
  }
  .title h1 {
    font-family: var(--display);
    font-size: clamp(30px, 6.5vw, 88px);
    line-height: 1;
    letter-spacing: .04em;
    color: var(--wheat);
    text-shadow:
      calc(var(--px)*-1) 0 0 var(--ink), var(--px) 0 0 var(--ink),
      0 calc(var(--px)*-1) 0 var(--ink), 0 var(--px) 0 var(--ink),
      calc(var(--px)*-1) calc(var(--px)*-1) 0 var(--ink),
      var(--px) calc(var(--px)*-1) 0 var(--ink),
      calc(var(--px)*-1) var(--px) 0 var(--ink),
      var(--px) var(--px) 0 var(--ink),
      calc(var(--px)*2) calc(var(--px)*2) 0 var(--red),
      calc(var(--px)*3) calc(var(--px)*3) 0 var(--ink),
      calc(var(--px)*5) calc(var(--px)*7) 0 rgba(2,2,0,.55);
    animation: drop .6s steps(4) both;
  }
  .title .lede {
    display: block;
    margin-top: calc(var(--px)*6);
    font-family: var(--body);
    font-size: clamp(13px, 1.4vw, 17px);
    color: var(--wheat);
    letter-spacing: .12em;
    text-shadow:
      calc(var(--px)*-1) 0 0 var(--ink), var(--px) 0 0 var(--ink),
      0 calc(var(--px)*-1) 0 var(--ink), 0 var(--px) 0 var(--ink),
      var(--px) var(--px) 0 rgba(2,2,0,.7);
  }
  @keyframes drop {
    from { transform: translateY(calc(var(--px)*-6)); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  .cue {
    justify-self: center;
    align-self: end;
    font-family: var(--display);
    font-size: clamp(9px, 1vw, 11px);
    letter-spacing: .2em;
    color: var(--cream);
    text-shadow: var(--px) var(--px) 0 var(--ink);
    animation: blink 1.2s steps(1, end) infinite;
    padding-bottom: 12px;
  }
  .cue::after { content: '  \25BE'; color: var(--torch); }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:.2} }

  /* ---------- DESCENT (image feed) ---------- */
  .descent {
    position: relative;
    z-index: 2;
    padding: 4vh 12px 8vh;
  }
  .descent-heading {
    text-align: center;
    margin-bottom: 24px;
  }
  .descent-heading .eyebrow {
    display: block;
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: .3em;
    color: var(--torch);
    margin-bottom: 12px;
    text-shadow: var(--px) var(--px) 0 var(--ink);
  }
  .descent-heading h2 {
    font-family: var(--display);
    font-size: clamp(16px, 2.6vw, 26px);
    color: var(--cream);
    letter-spacing: .04em;
    text-shadow:
      calc(var(--px)*-1) 0 0 var(--ink), var(--px) 0 0 var(--ink),
      0 calc(var(--px)*-1) 0 var(--ink), 0 var(--px) 0 var(--ink),
      calc(var(--px)*2) calc(var(--px)*3) 0 rgba(2,2,0,.6);
  }

  /* The feed: an Instagram-style grid. Small tiles, no captions; tap to open. */
  .feed {
    max-width: 720px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
  }
  .tile {
    position: relative; display: block; aspect-ratio: 3 / 4; overflow: hidden;
    background: #060708; border: 0; padding: 0; cursor: pointer;
    content-visibility: auto; contain-intrinsic-size: auto 160px;
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s ease, filter .25s ease; }
  .tile:hover img, .tile:focus-visible img { transform: scale(1.03); filter: brightness(1.08); }
  .tile:focus-visible { outline: 2px solid var(--torch); outline-offset: -2px; }
  .tile .multi { position: absolute; top: 6px; right: 6px; width: 12px; height: 12px;
    border: 2px solid var(--cream); box-shadow: 3px -3px 0 -1px var(--cream); opacity: .9; }
  @media (min-width: 700px) { .feed { gap: 6px; } }

  /* Viewer: full post on tap */
  .viewer { position: fixed; inset: 0; z-index: 200; background: #050707; display: none; flex-direction: column; }
  .viewer.open { display: flex; }
  .viewer-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; }
  .viewer-top span { font-family: var(--display); font-size: 9px; letter-spacing: .12em; color: var(--wheat); }
  .viewer-top button { background: none; border: 2px solid var(--cream); color: var(--cream); font-family: var(--display);
    font-size: 9px; letter-spacing: .1em; padding: 8px 10px; cursor: pointer; }
  .viewer .reel { flex: 1 1 auto; min-height: 0; }
  .viewer .reel img { max-height: 100%; height: 100%; object-fit: contain; }
  .viewer .post-text { padding: 12px 16px 22px; max-width: 560px; margin: 0 auto; width: 100%; }
  .viewer .nav { display: flex; justify-content: space-between; padding: 0 12px 14px; }
  .viewer .nav button { background: none; border: 0; color: var(--wheat); font-family: var(--display); font-size: 9px; letter-spacing: .1em; padding: 8px; cursor: pointer; }
  .reel {
    position: relative; display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .reel::-webkit-scrollbar { display: none; }
  .reel img { flex: 0 0 100%; width: 100%; scroll-snap-align: center; display: block; }
  .dots { display: flex; justify-content: center; gap: 6px; padding: 10px 0 0; }
  .dots i { width: 6px; height: 6px; background: var(--stone-cool); }
  .dots i.on { background: var(--torch); }
  .post-title { font-family: var(--display); font-size: clamp(11px, 3vw, 14px); line-height: 1.5; color: var(--wheat); margin-bottom: 8px; }
  .post-caption { font-size: 18px; line-height: 1.45; color: var(--cream); }
  .post-note { margin-top: 8px; font-size: 16px; line-height: 1.55; color: var(--wheat); opacity: .85; white-space: pre-line; }
  .post-date { margin-top: 12px; font-family: var(--display); font-size: 8px; letter-spacing: .14em; color: var(--torch); }
  .feed-empty { grid-column: 1 / -1; text-align: center; font-family: var(--display); font-size: 10px; letter-spacing: .14em; color: var(--wheat); opacity: .75; }
  .feed-more { height: 1px; }
  .ig-link { display: inline-block; margin-top: 14px; padding: 9px 12px; font-family: var(--display); font-size: 9px; letter-spacing: .08em;
    color: var(--cream); text-decoration: none; border: 2px solid var(--cream); background: rgba(12,20,18,.8); }
  .ig-link:hover, .ig-link:active { background: var(--cream); color: var(--ink); }
  .feed-end { text-align: center; margin-top: 8px; }
  .feed-empty { text-align: center; font-family: var(--display); font-size: 10px; letter-spacing: .14em; color: var(--wheat); opacity: .75; }

  /* ---------- SCROLL DEPTH INDICATOR ---------- */
  .depth {
    position: fixed;
    right: clamp(10px, 2vw, 22px);
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
  }
  .depth .torch {
    width: calc(var(--px)*3);
    height: calc(var(--px)*5);
    background: var(--stone-cool);
    border: var(--px) solid var(--ink);
    box-shadow: var(--px) var(--px) 0 rgba(2,2,0,.7);
    transition: background .2s steps(2);
  }
  .depth .torch.lit {
    background: var(--torch);
    box-shadow:
      var(--px) var(--px) 0 rgba(2,2,0,.7),
      0 0 8px 2px var(--torch-glow);
  }
  @media (max-width: 620px) { .depth { display: none; } }

  /* ---------- END ---------- */
  .end {
    position: relative;
    z-index: 2;
    max-width: 780px;
    margin: 0 auto;
    padding: 12vh 20px 6vh;
    text-align: center;
    color: var(--cream);
  }
  .end .marker {
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: .3em;
    color: var(--torch);
    margin-bottom: 14px;
    text-shadow: var(--px) var(--px) 0 var(--ink);
  }
  .end .colophon {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 22px;
    font-family: var(--display);
    font-size: 9px;
    letter-spacing: .18em;
    opacity: .85;
    text-shadow: var(--px) var(--px) 0 var(--ink);
  }
  .end em { color: var(--torch); font-style: normal; }
  .end a { color: var(--torch); text-decoration: none; }
  .end a:hover { color: var(--cream); }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .cue, .title h1 { animation: none; }
    .scene .layer { transition: none; }
  }

  </style>

<body>

  <!-- fixed scene stack: three layers, cross-fade on scroll -->
  <div class="scene" aria-hidden="true">
    <div class="layer on" data-layer="entry"><img src="../assets/cave-entry.png" alt="" /></div>
    <div class="layer"    data-layer="mid"><img src="../assets/cave-mid.png" alt="" /></div>
    <div class="layer"    data-layer="deep"><img src="../assets/cave-deep.png" alt="" /></div>
  </div>
  <div class="veil" aria-hidden="true"></div>

  <!-- scroll depth indicator (right edge) -->
  <div class="depth" aria-hidden="true">

    <span class="torch"></span>
    <span class="torch"></span>

  </div>

  <!-- arrival -->
  <section class="arrive">
    <a class="path-back" href="/">Back to the clearing</a>
    <div class="title">
      <h1>Gallery</h1>
      <span class="lede">Torch closer to read.</span>
    </div>
    <span class="cue">Descend</span>
  </section>

  <!-- descent: the feed -->
  <section class="descent" id="descent" aria-label="Gallery feed">
    <div class="descent-heading">
      <span class="eyebrow">On the walls</span>
      <h2>The Feed</h2>
      <a class="ig-link" href="https://instagram.com/snafusau" rel="noopener">More on Instagram · @snafusau ▸</a>
    </div>

    <div class="feed" id="feed" aria-live="polite"></div>
    <div class="feed-more" id="feed-more" aria-hidden="true"></div>
    <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Post">
      <div class="viewer-top"><span id="viewerCount"></span><button type="button" id="viewerClose">CLOSE ✕</button></div>
      <div class="reel" id="viewerReel"></div>
      <div class="dots" id="viewerDots"></div>
      <div class="post-text" id="viewerText"></div>
      <div class="nav"><button type="button" id="viewerPrev">◂ NEWER</button><button type="button" id="viewerNext">OLDER ▸</button></div>
    </div>
    <p class="feed-end"><a class="ig-link" href="https://instagram.com/snafusau" rel="noopener">Keep scrolling on Instagram · @snafusau ▸</a></p>
  </section>

  <!-- end -->
  <footer class="end">
    <div class="marker">\ deepest point \</div>
    <div class="colophon">
      <span>SNAFU. <em>Gallery</em></span>
      <span>Los Angeles</span>
      <span>Torchlit since 2026</span>
      <span><a href="/privacy/">Privacy</a></span>
      <span><a href="mailto:nate@snafu.quest">nate@snafu.quest</a></span>
    </div>
  </footer>

  <script>
    // The Feed: posts come from /api/posts (edited from the phone Desk).
    // Renders in batches as you scroll so it stays smooth however long it gets.
    (function () {
      var feed = document.getElementById('feed');
      var more = document.getElementById('feed-more');
      var posts = [], shown = 0, BATCH = 18;
      var MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

      function esc(v) {
        return String(v == null ? '' : v).replace(/[&<>'"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c];
        });
      }
      function fmtDate(d) {
        var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
        return m ? (+m[3]) + ' ' + MONTHS[+m[2] - 1] + ' ' + m[1] : '';
      }
      function tileHtml(p, i) {
        var ph = p.photos[0];
        return '<button type="button" class="tile" data-i="' + i + '" aria-label="' + esc(p.title || p.caption || 'Open post') + '">' +
          '<img src="' + esc(ph.src) + '" width="' + (ph.w || 3) + '" height="' + (ph.h || 4) + '" alt="" loading="' + (i < 9 ? 'eager' : 'lazy') + '" decoding="async">' +
          (p.photos.length > 1 ? '<span class="multi" aria-hidden="true"></span>' : '') + '</button>';
      }
      var viewer = document.getElementById('viewer');
      document.body.appendChild(viewer); // escape the section's stacking context so it covers the top bar
      var vReel = document.getElementById('viewerReel'),
          vDots = document.getElementById('viewerDots'), vText = document.getElementById('viewerText'),
          vCount = document.getElementById('viewerCount'), current = -1, lastFocus = null;
      function openPost(i) {
        var p = posts[i]; if (!p) return; current = i;
        vReel.innerHTML = p.photos.map(function (ph, n) { return '<img src="' + esc(ph.src) + '" alt="' + esc(p.title || p.caption || 'SNAFU') + (p.photos.length > 1 ? ' — ' + (n + 1) + ' of ' + p.photos.length : '') + '">'; }).join('');
        vReel.scrollLeft = 0;
        vDots.innerHTML = p.photos.length > 1 ? p.photos.map(function (_, n) { return '<i' + (n ? '' : ' class="on"') + '></i>'; }).join('') : '';
        var text = (p.title ? '<h3 class="post-title">' + esc(p.title) + '</h3>' : '') +
          (p.caption ? '<p class="post-caption">' + esc(p.caption) + '</p>' : '') +
          (p.note ? '<p class="post-note">' + esc(p.note) + '</p>' : '') +
          (fmtDate(p.date) ? '<p class="post-date">' + fmtDate(p.date) + '</p>' : '');
        vText.innerHTML = text; vText.style.display = text ? '' : 'none';
        vCount.textContent = (i + 1) + ' / ' + posts.length;
        if (!viewer.classList.contains('open')) { lastFocus = document.activeElement; viewer.classList.add('open'); document.body.style.overflow = 'hidden'; }
        history.replaceState(null, '', '#' + p.id);
        document.getElementById('viewerClose').focus({ preventScroll: true });
      }
      function closePost() {
        viewer.classList.remove('open'); document.body.style.overflow = ''; current = -1;
        history.replaceState(null, '', location.pathname);
        if (lastFocus) lastFocus.focus({ preventScroll: true });
      }
      document.getElementById('viewerClose').addEventListener('click', closePost);
      document.getElementById('viewerPrev').addEventListener('click', function () { if (current > 0) openPost(current - 1); });
      document.getElementById('viewerNext').addEventListener('click', function () { if (current < posts.length - 1) openPost(current + 1); });
      document.addEventListener('keydown', function (e) {
        if (!viewer.classList.contains('open')) return;
        if (e.key === 'Escape') closePost();
        if (e.key === 'ArrowDown') document.getElementById('viewerNext').click();
        if (e.key === 'ArrowUp') document.getElementById('viewerPrev').click();
      });
      vReel.addEventListener('scroll', function () {
        var n = Math.round(vReel.scrollLeft / vReel.clientWidth);
        vDots.querySelectorAll('i').forEach(function (d, k) { d.classList.toggle('on', k === n); });
      }, { passive: true });
      feed.addEventListener('click', function (e) {
        var t = e.target.closest('.tile'); if (t) openPost(+t.dataset.i);
      });

      function renderMore() {
        if (shown >= posts.length) return;
        var next = posts.slice(shown, shown + BATCH);
        feed.insertAdjacentHTML('beforeend', next.map(function (p, k) { return tileHtml(p, shown + k); }).join(''));
        shown += next.length;
      }
      function start(list) {
        posts = (list || []).filter(function (p) { return p && p.photos && p.photos.length; });
        feed.innerHTML = '';
        shown = 0;
        if (!posts.length) { feed.innerHTML = '<p class="feed-empty">New posts are on the way.</p>'; return; }
        renderMore();
        if ('IntersectionObserver' in window) {
          new IntersectionObserver(function (entries) {
            if (entries[0].isIntersecting) renderMore();
          }, { rootMargin: '1200px 0px' }).observe(more);
        } else {
          while (shown < posts.length) renderMore();
        }
        if (location.hash) {
          var hid = location.hash.slice(1);
          for (var k = 0; k < posts.length; k++) if (posts[k].id === hid) { openPost(k); break; }
        }
      }
      fetch('/api/posts', { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function (d) { start(d.posts); })
        .catch(function () {
          fetch('/content/posts.json').then(function (r) { return r.json(); })
            .then(function (d) { start(d.posts); })
            .catch(function () { start([]); });
        });
    }());

    // Scene swap on scroll + depth indicator.
    // Three background layers cross-fade in stepped opacity as you descend.
    (function () {
      var layers = document.querySelectorAll('.scene .layer');
      var torches = document.querySelectorAll('.depth .torch');
      var ticking = false;

      function update() {
        var h = document.documentElement.scrollHeight - window.innerHeight;
        var p = h > 0 ? window.scrollY / h : 0; // 0 → 1

        // Scene swap thresholds
        var active = 'entry';
        if (p > 0.66)      active = 'deep';
        else if (p > 0.28) active = 'mid';

        layers.forEach(function (l) {
          l.classList.toggle('on', l.dataset.layer === active);
        });

        // Depth torches light up as you descend
        var lit = Math.min(torches.length, Math.ceil(p * torches.length));
        torches.forEach(function (t, i) {
          t.classList.toggle('lit', i < lit);
        });

        ticking = false;
      }

      window.addEventListener('scroll', function () {
        if (!ticking) { requestAnimationFrame(update); ticking = true; }
      }, { passive: true });
      update();
    })();
  </script>
  <script src="/js/site.js" defer></script>
</body>
</html>
