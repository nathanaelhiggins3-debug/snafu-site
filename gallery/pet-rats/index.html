<style>
/* SNAFU GALLERY EXHIBIT — torchlit. Drop photos named pet-rats-01.jpg ... into ./photos/.
   Missing files hide themselves. Edit each data-cap="" + caption text. */
:root{--floor:#0d0a0c;--amber:#e3aa4d;--ember:#c0602a;--cream:#f2e4c4;--wheat:#e8d29a;--rose:#814951;--ink:#0a0809;--frame:#3a2a12;--px:3px;
  --display:'Press Start 2P',monospace;--ui:'Pixelify Sans',monospace;--body:'EB Garamond',Georgia,serif}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{background:var(--floor);color:var(--cream);font-family:var(--ui);-webkit-font-smoothing:antialiased}
.cave{position:fixed;inset:0;z-index:0;background:
  radial-gradient(120% 80% at 50% -8%,rgba(227,170,77,.18),transparent 55%),
  radial-gradient(90% 60% at 50% 118%,rgba(192,96,42,.15),transparent 60%),var(--floor)}
.cave::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);opacity:.5}
.strip{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px clamp(16px,4vw,32px);background:rgba(10,8,9,.9);border-bottom:var(--px) solid #2a1f18;font-family:var(--display);font-size:9px;letter-spacing:.16em;color:var(--cream);text-transform:uppercase}
.strip a{color:var(--cream);text-decoration:none}.strip a:hover{color:var(--amber)}
.strip .back::before{content:'\25C2  ';color:var(--ember)}.strip .here{color:var(--amber)}
.hero{position:relative;z-index:2;max-width:860px;margin:0 auto;padding:clamp(40px,8vh,90px) clamp(20px,5vw,32px) 10px;text-align:center}
.hero .eyebrow{font-family:var(--display);font-size:9px;letter-spacing:.28em;color:var(--amber);margin-bottom:18px;text-shadow:2px 2px 0 var(--ink)}
.hero .eyebrow .dot{color:var(--ember)}
.hero h1{font-family:var(--display);font-size:clamp(30px,8vw,62px);line-height:1.05;color:var(--wheat);text-shadow:-2px 0 0 var(--ink),2px 0 0 var(--ink),0 -2px 0 var(--ink),0 2px 0 var(--ink),4px 4px 0 var(--ember),5px 5px 0 var(--ink),7px 10px 0 rgba(0,0,0,.5)}
.hero .intro{font-family:var(--body);font-size:clamp(17px,2.4vw,21px);line-height:1.55;color:var(--cream);opacity:.92;max-width:52ch;margin:22px auto 0}
.hero .readmore{display:inline-block;margin-top:22px;font-family:var(--display);font-size:9px;letter-spacing:.14em;color:var(--ink);background:var(--amber);text-decoration:none;padding:12px 16px;border:var(--px) solid var(--ink);box-shadow:var(--px) var(--px) 0 rgba(0,0,0,.6)}
.hero .readmore:hover{background:var(--wheat)}
.hero .cue{display:block;margin-top:34px;font-family:var(--display);font-size:9px;letter-spacing:.2em;color:var(--cream);opacity:.7}
.hero .cue::after{content:'  \25BE';color:var(--amber)}
.shots{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:6vh clamp(16px,4vw,24px) 4vh;display:flex;flex-direction:column;gap:clamp(30px,5vw,46px)}
.shot{margin:0;cursor:zoom-in}
/* the frame + torch-lighting on each photo */
.shot img{display:block;width:100%;height:auto;border:var(--px) solid var(--ink);
  box-shadow:0 0 0 2px var(--frame), 4px 6px 0 rgba(0,0,0,.6), 0 0 70px 10px rgba(227,170,77,.13);
  transition:box-shadow .2s,transform .2s}
.shot img:hover{box-shadow:0 0 0 2px var(--amber), 4px 6px 0 rgba(0,0,0,.6), 0 0 90px 14px rgba(227,170,77,.22);transform:translateY(-2px)}
.shot figcaption{margin-top:13px;font-family:var(--body);font-size:16px;line-height:1.5;color:var(--cream);opacity:.9}
.shot figcaption .n{font-family:var(--display);font-size:8px;letter-spacing:.14em;color:var(--ember);margin-right:8px}
.foot{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:5vh 20px 8vh;text-align:center}
.foot .marker{font-family:var(--display);font-size:9px;letter-spacing:.3em;color:var(--amber);margin-bottom:14px;text-shadow:2px 2px 0 var(--ink)}
.foot .meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 20px;font-family:var(--display);font-size:8px;letter-spacing:.16em;color:var(--cream);opacity:.7}
.foot a{color:var(--amber);text-decoration:none}
.lb{position:fixed;inset:0;z-index:60;display:none;background:rgba(6,4,5,.95);flex-direction:column;align-items:center;justify-content:center;padding:16px;touch-action:pan-y}
.lb.open{display:flex}
.lb-stage{max-width:min(94vw,900px);max-height:74vh;display:flex;align-items:center;justify-content:center}
.lb-stage img{max-width:100%;max-height:74vh;width:auto;border:var(--px) solid var(--ink);box-shadow:0 0 0 2px var(--frame),0 0 80px 12px rgba(227,170,77,.18)}
.lb-cap{margin-top:16px;max-width:min(94vw,720px);text-align:center;font-family:var(--body);font-size:16px;line-height:1.5;color:var(--cream)}
.lb-x{position:absolute;top:12px;right:14px;font-family:var(--display);font-size:12px;color:var(--cream);background:none;border:0;cursor:pointer;padding:10px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--display);font-size:16px;color:var(--cream);background:rgba(20,16,19,.7);border:var(--px) solid var(--ink);cursor:pointer;padding:14px 12px;line-height:1}
.lb-prev{left:10px}.lb-next{right:10px}
.lb-count{position:absolute;bottom:16px;font-family:var(--display);font-size:8px;letter-spacing:.16em;color:var(--amber)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.shot img{transition:none}}
</style>
</head>
<body>
<div class="cave" aria-hidden="true"></div>
<nav class="strip"><a class="back" href="/gallery/">Back to the cave</a><span class="here">SNAFU · Gallery</span></nav>

<header class="hero">
  <div class="eyebrow">Showcase <span class="dot">·</span> LIVE <span class="dot">·</span> [VENUE], [DATE]</div>
  <h1>Pet Rats</h1>
  <p class="intro">[Intro blurb — the night, who played, why Pet Rats. One or two lines.]</p>
  <a class="readmore" href="/news/editorial/pet-rats/">Read the full story →</a>
  <span class="cue">Scroll the set</span>
</header>

<!-- Photos auto-load from ./photos/ by filename. Name them pet-rats-01.jpg ... pet-rats-12.jpg.
     Any slot with no matching file hides itself. Just edit the caption text + data-cap. -->
<div class="shots" id="shots">
  <figure class="shot" data-cap="[Caption 1.]"><img src="photos/pet-rats-01.jpg" alt="" loading="lazy" onerror="this.closest('.shot').style.display='none'"><figcaption><span class="n">01</span>[Caption 1.]</figcaption></figure>
  <figure class="shot" data-cap="[Caption 2.]"><img src="photos/pet-rats-02.jpg" alt="" loading="lazy" onerror="this.closest('.shot').style.display='none'"><figcaption><span class="n">02</span>[Caption 2.]</figcaption></figure>
  <figure class="shot" data-cap="[Caption 3.]"><img src="photos/pet-rats-03.jpg" alt="" loading="lazy" onerror="this.closest('.shot').style.display='none'"><figcaption><span class="n">03</span>[Caption 3.]</figcaption></figure>
  <figure class="shot" data-cap="[Caption 4.]"><img src="photos/pet-rats-04.jpg" alt="" loading="lazy" onerror="this.closest('.shot').style.display='none'"><figcaption><span class="n">04</span>[Caption 4.]</figcaption></figure>
  <figure class="shot" data-cap="[Caption 5.]"><img src="photos/pet-rats-05.jpg" alt="" loading="lazy" onerror="this.closest('.shot').style.display='none'"><figcaption><span class="n">05</span>[Caption 5.]</figcaption></figure>
  <figure class="shot" data-cap="[Caption 6.]"><img src="photos/pet-rats-06.jpg" alt="" loading="lazy" onerror="this.closest('.shot').style.display='none'"><figcaption><span class="n">06</span>[Caption 6.]</figcaption></figure>
  <figure class="shot" data-cap="[Caption 7.]"><img src="photos/pet-rats-07.jpg" alt="" loading="lazy" onerror="this.closest('.shot').style.display='none'"><figcaption><span class="n">07</span>[Caption 7.]</figcaption></figure>
  <figure class="shot" data-cap="[Caption 8.]"><img src="photos/pet-rats-08.jpg" alt="" loading="lazy" onerror="this.closest('.shot').style.display='none'"><figcaption><span class="n">08</span>[Caption 8.]</figcaption></figure>
</div>

<footer class="foot">
  <div class="marker">\ deepest point \</div>
  <div class="meta"><span>SNAFU · Gallery</span><span>Los Angeles</span><span>Torchlit since 2026</span><span><a href="mailto:nate@snafu.quest">nate@snafu.quest</a></span></div>
</footer>

<div class="lb" id="lb" aria-hidden="true">
  <button class="lb-x" id="lbX" aria-label="Close">CLOSE ✕</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">◂</button>
  <div class="lb-stage" id="lbStage"></div>
  <div class="lb-cap" id="lbCap"></div>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next">▸</button>
  <div class="lb-count" id="lbCount"></div>
</div>
<script>
(function(){
  var lb=document.getElementById('lb'),stage=document.getElementById('lbStage'),cap=document.getElementById('lbCap'),count=document.getElementById('lbCount'),i=0,shots=[];
  function live(){return [].slice.call(document.querySelectorAll('.shot')).filter(function(s){return s.style.display!=='none'&&s.querySelector('img')});}
  function render(){var s=shots[i],m=s.querySelector('img');stage.innerHTML='';stage.appendChild(m.cloneNode(true));cap.textContent=s.getAttribute('data-cap')||'';count.textContent=(i+1)+' / '+shots.length;}
  function open(s){shots=live();i=shots.indexOf(s);if(i<0)return;render();lb.classList.add('open');lb.setAttribute('aria-hidden','false');}
  function close(){lb.classList.remove('open');lb.setAttribute('aria-hidden','true');}
  function next(){i=(i+1)%shots.length;render();}function prev(){i=(i-1+shots.length)%shots.length;render();}
  document.getElementById('shots').addEventListener('click',function(e){var s=e.target.closest('.shot');if(s)open(s);});
  document.getElementById('lbX').addEventListener('click',close);
  document.getElementById('lbNext').addEventListener('click',function(e){e.stopPropagation();next();});
  document.getElementById('lbPrev').addEventListener('click',function(e){e.stopPropagation();prev();});
  lb.addEventListener('click',function(e){if(e.target===lb)close();});
  document.addEventListener('keydown',function(e){if(!lb.classList.contains('open'))return;if(e.key==='Escape')close();else if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();});
  var x0=null;lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
  lb.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40){dx<0?next():prev();}x0=null;},{passive:true});
})();
</script>
