<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <meta name="theme-color" content="#0c1412">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SNAFU">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SNAFU. — Order received</title>
  <meta name="description" content="Your SNAFU order was received." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/styles.css?v=10" />

  <script defer src="https://analytics.snafu.quest/script.js" data-website-id="664fa64b-2817-4e3f-9304-bb448b8d09cd"></script>
<script src="/js/pixels.js"></script>
</head>
<body>

  <section class="page-head wrap">
    <h1 class="page-head__title">Received</h1>
    <p class="page-head__lede">Payment confirmed. The piece is yours, and it is now off the shop.</p>
    <p>Your receipt is on its way to your email. We pack by hand and send tracking as soon as it ships. Thank you for collecting with SNAFU.</p>
    <a class="backlink" href="../shop/">&larr; Back to the Shop</a>
  </section>

  <!-- Purchase event. Buy now links land here with ?item=<id>; the bag
       checkout lands with ?items=<id,id>. Fires once per checkout session
       (reloads don't double count). A bag purchase also locks each piece's
       Buy now link and empties those pieces from the bag. -->
  <script src="../js/shop-data.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var ids = (q.get('items') || q.get('item') || '').split(',').filter(Boolean);
      var sid = q.get('session_id') || '';
      var pieces = (window.SNAFU_SHOP || []).filter(function (p) { return ids.indexOf(p.id) > -1; });
      if (!pieces.length) return;
      if (window.SNAFU_CART) pieces.forEach(function (p) { window.SNAFU_CART.remove(p.id); });
      if (q.get('items') && sid) fetch('/api/checkout?confirm=' + encodeURIComponent(sid)).catch(function () {});
      var key = 'snafu.purchase.' + (sid || ids.join(','));
      try { if (localStorage.getItem(key)) return; localStorage.setItem(key, '1'); } catch (e) {}
      var skus = pieces.map(function (p) { return p.sku || p.id; });
      var total = pieces.reduce(function (s, p) { return s + Number(p.price || 0); }, 0);
      var fire = function () {
        if (typeof snafuTrackPurchase === 'function') return snafuTrackPurchase(skus, total);
        if (window.fbq) fbq('track', 'Purchase', { value: total, currency: 'USD', content_ids: skus, content_type: 'product' });
      };
      if (document.readyState === 'complete') fire(); else window.addEventListener('load', fire);
    })();
  </script>
  <script src="../js/site.js"></script>
</body>
</html>
