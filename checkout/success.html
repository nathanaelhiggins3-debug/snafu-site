<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SNAFU. — Order received</title>
  <meta name="description" content="Your SNAFU order was received." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/styles.css?v=10" />

  <script defer src="https://analytics.snafu.quest/script.js" data-website-id="664fa64b-2817-4e3f-9304-bb448b8d09cd"></script>
<script src="/js/pixels.js"></script>
</head>
<body>

  <section class="page-head wrap">
    <h1 class="page-head__title">Received</h1>
    <p class="page-head__lede">Payment confirmed in test mode. Your piece is held. Each one is one-of-one, so it is now off the board.</p>
    <p>We file and pack by hand. You will get a confirmation and shipping note from us directly. Thank you for collecting with SNAFU.</p>
    <a class="backlink" href="../shop/">&larr; Back to the Shop</a>
  </section>

  <!-- Fire the Purchase event, then clear the cart. -->
  <script src="../js/cart.js"></script>
  <script>
    (function () {
      if (!window.SNAFU_CART) return;
      // ── PIXEL: Purchase — read the cart one last time before clearing ──
      // NOTE: this reflects the browser-side view of the sale. The canonical
      // event should be sent server-side from a Stripe webhook (see api/checkout.js)
      // once STRIPE_SECRET_KEY + STRIPE_WEBHOOK_SECRET are set — that recovers
      // the ~30-40% of iOS/adblocker traffic the browser pixel loses.
      try {
        var items = window.SNAFU_CART.read();
        var ids = items.map(function (i) { return i.id; });
        var total = window.SNAFU_CART.subtotal();
        if (typeof snafuTrackPurchase === "function") {
          snafuTrackPurchase(ids, total);
        }
      } catch (e) {}
      window.SNAFU_CART.clear();
    })();
  </script>
  <script src="../js/site.js"></script>
</body>
</html>
