<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <meta name="theme-color" content="#0c1412">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SNAFU">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SNAFU. — Order received</title>
  <meta name="description" content="Your SNAFU order was received." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/styles.css?v=10" />

  <script defer src="https://analytics.snafu.quest/script.js" data-website-id="664fa64b-2817-4e3f-9304-bb448b8d09cd"></script>
<script src="/js/pixels.js"></script>
</head>
<body>

  <section class="page-head wrap">
    <h1 class="page-head__title">Received</h1>
    <p class="page-head__lede">Payment confirmed. The piece is yours. Each one is one of one, so it is now off the board.</p>
    <p>Your receipt is on its way to your email. We pack by hand and send tracking as soon as it ships. Thank you for collecting with SNAFU.</p>
    <a class="backlink" href="../shop/">&larr; Back to the Shop</a>
  </section>

  <!-- Purchase event: each Stripe Payment Link redirects here with ?item=<shop id>.
       Fires once per checkout session (reloads don't double count). -->
  <script src="../js/shop-data.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var id = q.get('item'), sid = q.get('session_id') || '';
      var piece = (window.SNAFU_SHOP || []).filter(function (p) { return p.id === id; })[0];
      if (!piece) return;
      var key = 'snafu.purchase.' + (sid || id);
      try { if (localStorage.getItem(key)) return; localStorage.setItem(key, '1'); } catch (e) {}
      var fire = function () {
        if (typeof snafuTrackPurchase === 'function') return snafuTrackPurchase([piece.sku || piece.id], piece.price);
        if (window.fbq) fbq('track', 'Purchase', { value: piece.price, currency: 'USD', content_ids: [piece.sku || piece.id], content_type: 'product' });
      };
      if (document.readyState === 'complete') fire(); else window.addEventListener('load', fire);
    })();
  </script>
  <script src="../js/site.js"></script>
</body>
</html>
